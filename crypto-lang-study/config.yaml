# Study configuration. Edit model names / versions here, nothing else needs changing.
prompts_file: data/prompts.json
output_dir: results

languages: [en, ur, ru, cm, zh, ar]
repeats: 5            # samples per prompt per model per condition
temperature: 0.7
max_tokens: 2048
seed_base: 1000       # seed = seed_base + repeat index (Ollama honours it)

# conditions: "baseline" = no system prompt (RQ1-3); "secure" = secure_system_prompt from prompts.json (RQ4)
conditions: [baseline, secure]

models:
  # --- open models via Ollama (http://localhost:11434). Pull first: ollama pull <tag>
  - id: qwen2.5-coder-7b
    backend: ollama
    name: qwen2.5-coder:7b-instruct-q4_K_M
  - id: llama3.1-8b
    backend: ollama
    name: llama3.1:8b-instruct-q4_K_M
  - id: deepseek-coder-6.7b
    backend: ollama
    name: deepseek-coder:6.7b-instruct-q4_K_M

  # --- commercial models via any OpenAI-compatible endpoint. Uncomment and set the env var.
  # - id: gemini-flash
  #   backend: openai_compat
  #   name: gemini-2.5-flash             # write the exact version you used in Table 2
  #   base_url: https://generativelanguage.googleapis.com/v1beta/openai
  #   api_key_env: GEMINI_API_KEY
  # - id: gpt-mini
  #   backend: openai_compat
  #   name: gpt-4o-mini
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY

  # --- mock backend: canned answers, used only to test the pipeline. Remove for the real run.
  - id: mock
    backend: mock
    name: mock-v1

ollama_url: http://localhost:11434
