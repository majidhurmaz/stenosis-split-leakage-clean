# Local Semgrep rules for Python crypto misuse (no registry / internet needed).
# Each rule id starts with the study label it maps to, e.g. ECB_MODE.<something>.
rules:
  - id: WEAK_HASH.hashlib
    languages: [python]
    severity: WARNING
    message: MD5/SHA-1 is not collision resistant (CWE-328)
    metadata: {cwe: CWE-328}
    patterns:
      - pattern-not: 'hashlib.$H(..., usedforsecurity=False)'
      - pattern-either:
        - pattern: 'hashlib.md5(...)'
        - pattern: 'hashlib.sha1(...)'
        - pattern: 'hashlib.new("md5", ...)'
        - pattern: 'hashlib.new("sha1", ...)'
        - pattern: 'cryptography.hazmat.primitives.hashes.MD5()'
        - pattern: 'cryptography.hazmat.primitives.hashes.SHA1()'
        - pattern: 'Crypto.Hash.MD5.new(...)'
        - pattern: 'Crypto.Hash.SHA1.new(...)'

  - id: ECB_MODE.any
    languages: [python]
    severity: ERROR
    message: ECB mode leaks plaintext patterns (CWE-327)
    metadata: {cwe: CWE-327}
    pattern-either:
      - pattern: 'cryptography.hazmat.primitives.ciphers.modes.ECB(...)'
      - pattern: '$C.new($K, $C.MODE_ECB, ...)'
      - pattern: 'Crypto.Cipher.AES.MODE_ECB'

  - id: WEAK_CIPHER.any
    languages: [python]
    severity: ERROR
    message: Broken or legacy cipher (CWE-327)
    metadata: {cwe: CWE-327}
    pattern-either:
      - pattern: 'Crypto.Cipher.DES.new(...)'
      - pattern: 'Crypto.Cipher.DES3.new(...)'
      - pattern: 'Crypto.Cipher.ARC4.new(...)'
      - pattern: 'Crypto.Cipher.ARC2.new(...)'
      - pattern: 'Crypto.Cipher.Blowfish.new(...)'
      - pattern: 'cryptography.hazmat.primitives.ciphers.algorithms.TripleDES(...)'
      - pattern: 'cryptography.hazmat.primitives.ciphers.algorithms.ARC4(...)'
      - pattern: 'cryptography.hazmat.primitives.ciphers.algorithms.Blowfish(...)'
      - pattern: 'cryptography.hazmat.decrepit.ciphers.algorithms.$ALG(...)'

  - id: STATIC_IV.literal
    languages: [python]
    severity: ERROR
    message: Constant IV/nonce (CWE-329)
    metadata: {cwe: CWE-329}
    pattern-either:
      - pattern: 'cryptography.hazmat.primitives.ciphers.modes.CBC(b"...")'
      - pattern: 'cryptography.hazmat.primitives.ciphers.modes.GCM(b"...")'
      - pattern: 'cryptography.hazmat.primitives.ciphers.modes.CTR(b"...")'
      - pattern: '$C.new($K, $MODE, b"...")'
      - pattern: '$C.new($K, $MODE, iv=b"...")'
      - pattern: '$C.new($K, $MODE, nonce=b"...")'
      - pattern: '$X.encrypt(b"...", $DATA, $AAD)'

  - id: WEAK_RANDOM.random_module
    languages: [python]
    severity: WARNING
    message: random is not a CSPRNG; use secrets (CWE-338)
    metadata: {cwe: CWE-338}
    pattern-either:
      - pattern: 'random.choice(...)'
      - pattern: 'random.choices(...)'
      - pattern: 'random.randint(...)'
      - pattern: 'random.randrange(...)'
      - pattern: 'random.random(...)'
      - pattern: 'random.getrandbits(...)'
      - pattern: 'random.sample(...)'

  - id: SHORT_RSA_KEY.cryptography
    languages: [python]
    severity: ERROR
    message: RSA key shorter than 2048 bits (CWE-326)
    metadata: {cwe: CWE-326}
    patterns:
      - pattern-either:
          - pattern: 'cryptography.hazmat.primitives.asymmetric.rsa.generate_private_key(..., key_size=$N, ...)'
          - pattern: 'Crypto.PublicKey.RSA.generate($N, ...)'
      - metavariable-comparison:
          metavariable: $N
          comparison: $N < 2048

  - id: TLS_NO_VERIFY.requests
    languages: [python]
    severity: ERROR
    message: Certificate verification disabled (CWE-295)
    metadata: {cwe: CWE-295}
    pattern-either:
      - pattern: 'requests.$M(..., verify=False, ...)'
      - pattern: '$S.verify = False'
      - pattern: 'ssl._create_unverified_context(...)'
      - pattern: '$CTX.check_hostname = False'
      - pattern: '$CTX.verify_mode = ssl.CERT_NONE'
      - pattern: 'httpx.$M(..., verify=False, ...)'

  - id: OLD_TLS.protocol
    languages: [python]
    severity: ERROR
    message: Obsolete SSL/TLS version (CWE-327)
    metadata: {cwe: CWE-327}
    pattern-either:
      - pattern: 'ssl.PROTOCOL_SSLv2'
      - pattern: 'ssl.PROTOCOL_SSLv3'
      - pattern: 'ssl.PROTOCOL_TLSv1'
      - pattern: 'ssl.PROTOCOL_TLSv1_1'
      - pattern: '$CTX.minimum_version = ssl.TLSVersion.TLSv1'
      - pattern: '$CTX.minimum_version = ssl.TLSVersion.TLSv1_1'

  - id: JWT_NO_VERIFY.decode
    languages: [python]
    severity: ERROR
    message: JWT signature not verified (CWE-347)
    metadata: {cwe: CWE-347}
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: 'jwt.decode(..., verify=False, ...)'
      - pattern: 'jwt.encode(..., algorithm="none", ...)'

  - id: HARDCODED_KEY.literal
    languages: [python]
    severity: WARNING
    message: Hard-coded cryptographic key or secret (CWE-321)
    metadata: {cwe: CWE-321}
    pattern-either:
      - pattern: 'jwt.encode($P, "...", ...)'
      - pattern: 'jwt.decode($T, "...", ...)'
      - pattern: 'hmac.new(b"...", ...)'
      - pattern: '$C.new(b"...", ...)'
      - pattern: 'cryptography.fernet.Fernet(b"...")'
      - pattern: 'cryptography.hazmat.primitives.ciphers.aead.AESGCM(b"...")'
      - pattern: '$APP.config["SECRET_KEY"] = "..."'

  - id: TIMING_COMPARE.hmac_eq
    languages: [python]
    severity: WARNING
    message: Compare MACs with hmac.compare_digest (CWE-208)
    metadata: {cwe: CWE-208}
    patterns:
      - pattern-either:
          - pattern: '$A == hmac.new(...).hexdigest()'
          - pattern: 'hmac.new(...).hexdigest() == $A'
          - pattern: '$A == hmac.new(...).digest()'
          - pattern: 'hmac.new(...).digest() == $A'
          - pattern: '$A != hmac.new(...).hexdigest()'
          - pattern: 'hmac.new(...).hexdigest() != $A'
